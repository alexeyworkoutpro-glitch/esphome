esphome:
  name: esp32p4

esp32:
  variant: esp32p4
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# Используем только UART-логгер, он надежнее
logger:
  level: DEBUG

# Блок связи с Wi-Fi чипом ESP32-C6 (SDIO)
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# Включаем Wi-Fi
wifi:
  ssid: "MTS_GPON_ab2b70"
  password: "Gbi393a3"

# Мигаем подсветкой, чтобы подать знак
output:
  - platform: ledc
    pin: GPIO23
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    restore_mode: ALWAYS_ON

